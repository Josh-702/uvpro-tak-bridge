# Cloud builds for someone without a Mac.
# Secrets live in the Codemagic UI, never in this file.
# Step by step: docs/RELEASE-NO-MAC.md

workflows:
  open-uv-bridge-ios:
    name: Open UV Bridge iOS
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Open UV Bridge
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.wa7brm.openuvbridge
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Test the Swift package
        script: swift test
      - name: Generate the Xcode project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Apply the signing files Codemagic fetched
        script: xcode-project use-profiles
      - name: Build the App Store IPA
        script: |
          xcode-project build-ipa \
            --project OpenUVBridge.xcodeproj \
            --scheme OpenUVBridge
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  open-uv-bridge-android:
    name: Open UV Bridge Android
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Test and build the APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew test assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
