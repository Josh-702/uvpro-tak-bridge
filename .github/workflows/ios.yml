name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Swift package tests
    # The 6.2.3 toolchain below is the Ubuntu 24.04 build. ubuntu-latest is 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Refuse committed secrets
        run: |
          set -euo pipefail
          if git grep -I -n -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- . ':(exclude)docs' ':(exclude)*.md'; then
            echo "A private key is committed. Remove it and rotate it."
            exit 1
          fi
      - name: Install Swift system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            git \
            gnupg2 \
            libc6-dev \
            libcurl4-openssl-dev \
            libedit2 \
            libgcc-13-dev \
            libncurses-dev \
            libpython3-dev \
            libsqlite3-0 \
            libstdc++-13-dev \
            libxml2-dev \
            libz3-dev \
            pkg-config \
            tzdata \
            zip \
            unzip \
            zlib1g-dev
      - name: Restore the Swift toolchain
        id: swift-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/swift-6.2.3
          key: swift-6.2.3-ubuntu24.04-v2
      - name: Install Swift 6.2.3
        if: steps.swift-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/install-swift.sh "${RUNNER_TOOL_CACHE}/swift-6.2.3"
      - name: Put Swift on PATH
        run: echo "${RUNNER_TOOL_CACHE}/swift-6.2.3/usr/bin" >> "$GITHUB_PATH"
      - name: swift test
        run: swift test

  ios:
    name: iOS compile and TestFlight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compile the iOS app without signing
        run: |
          xcodebuild \
            -project OpenUVBridge.xcodeproj \
            -scheme OpenUVBridge \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: See whether TestFlight secrets are configured
        id: signing
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          key=$(printf '%s' "$KEY_ID" | tr -d '[:space:]')
          if [ -n "$key" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "TestFlight secrets are not set yet. The compile above is the check. See docs/RELEASE-NO-MAC.md."
          fi
      - name: Check the certificates repo
        if: steps.signing.outputs.ready == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/ci/check-certs-repo.sh
      - name: Upload to TestFlight
        if: steps.signing.outputs.ready == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci/signing-env.sh
          source scripts/ci/signing-env.sh
          signing_prepare
          bundle install
          bundle exec fastlane ios beta
