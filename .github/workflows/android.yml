name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: Unit tests and APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the debug APK
        working-directory: android
        run: ./gradlew test assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: open-uv-bridge-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Build a signed release APK when a keystore is stored
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "No Android keystore secret. The debug APK above is the artifact."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: open-uv-bridge-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
