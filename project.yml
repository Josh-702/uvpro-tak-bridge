name: OpenUVBridge
options:
  bundleIdPrefix: net.wa7brm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  SWIFT_VERSION: "5.9"
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: "4"
packages:
  UVBridgeCore:
    path: .
targets:
  OpenUVBridge:
    type: application
    platform: iOS
    sources:
      - path: App/OpenUVBridge
        excludes:
          - Info.plist
    dependencies:
      - package: UVBridgeCore
        product: UVBridgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.wa7brm.openuvbridge
        PRODUCT_NAME: OpenUVBridge
        INFOPLIST_FILE: App/OpenUVBridge/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "4"
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: false
